<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel+Decorative:wght@700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a0f00;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'IM Fell English', serif;
    }

    /* Animated gear background */
    .gears {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .gear {
      position: absolute;
      border-radius: 50%;
      border: 6px solid #7a4f1e;
      opacity: 0.18;
      animation: spin linear infinite;
    }

    .gear::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 10px dashed #a0621a;
    }

    .gear-1 { width: 260px; height: 260px; top: -60px; left: -60px; animation-duration: 28s; }
    .gear-2 { width: 180px; height: 180px; bottom: -40px; right: -40px; animation-duration: 20s; animation-direction: reverse; }
    .gear-3 { width: 120px; height: 120px; top: 50%; right: 8%; animation-duration: 15s; }
    .gear-4 { width: 90px;  height: 90px;  bottom: 15%; left: 6%; animation-duration: 18s; animation-direction: reverse; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Steam particles */
    .steam-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .steam {
      position: absolute;
      bottom: 0;
      width: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,160,80,0.5), transparent 70%);
      animation: rise linear infinite;
      opacity: 0;
    }

    .steam:nth-child(1)  { left: 10%; width: 8px;  height: 80px;  animation-duration: 6s;  animation-delay: 0s; }
    .steam:nth-child(2)  { left: 25%; width: 5px;  height: 60px;  animation-duration: 7s;  animation-delay: 1s; }
    .steam:nth-child(3)  { left: 45%; width: 10px; height: 100px; animation-duration: 5s;  animation-delay: 2s; }
    .steam:nth-child(4)  { left: 65%; width: 6px;  height: 70px;  animation-duration: 8s;  animation-delay: 0.5s; }
    .steam:nth-child(5)  { left: 80%; width: 7px;  height: 90px;  animation-duration: 6.5s; animation-delay: 3s; }

    @keyframes rise {
      0%   { transform: translateY(0) scale(1);   opacity: 0.6; }
      100% { transform: translateY(-340px) scale(3); opacity: 0; }
    }

    /* Main frame */
    .frame {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 80px;
      border: 3px solid #8b5e1a;
      background: linear-gradient(160deg, #1f1100 0%, #2e1a00 50%, #1a0f00 100%);
      box-shadow:
        0 0 0 6px #3d2200,
        0 0 0 9px #7a4a10,
        0 0 60px 10px rgba(180, 110, 20, 0.35),
        inset 0 0 40px rgba(0,0,0,0.7);
      max-width: 640px;
      width: 90vw;
    }

    /* Corner rivets */
    .frame::before,
    .frame::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f0c060, #7a4a10);
      box-shadow: 0 0 6px rgba(240,180,60,0.5);
    }

    .frame::before { top: 12px; left: 12px; }
    .frame::after  { top: 12px; right: 12px; }

    .rivets-bottom::before,
    .rivets-bottom::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f0c060, #7a4a10);
      box-shadow: 0 0 6px rgba(240,180,60,0.5);
    }

    .rivets-bottom::before { bottom: 12px; left: 12px; }
    .rivets-bottom::after  { bottom: 12px; right: 12px; }

    /* Divider ornament */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px auto;
      color: #a07030;
    }

    .divider span {
      font-size: 1.4rem;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #a07030, transparent);
    }

    /* Title */
    h1 {
      font-family: 'Cinzel Decorative', 'Georgia', serif;
      font-size: clamp(2.4rem, 7vw, 4rem);
      color: #f0c060;
      text-shadow:
        0 0 10px rgba(240,180,60,0.8),
        0 0 30px rgba(200,120,20,0.5),
        2px 2px 0 #3d1f00;
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    /* Coming soon */
    .coming-soon {
      font-size: clamp(1rem, 3vw, 1.35rem);
      color: #c8943a;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-style: italic;
      text-shadow: 0 0 12px rgba(200,140,50,0.6);
      margin-top: 8px;
    }

    /* Gauge decoration */
    .gauge-row {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 32px;
    }

    .gauge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #7a4a10;
      background: radial-gradient(circle at 40% 35%, #3d2200, #120800);
      box-shadow: 0 0 8px rgba(180,100,20,0.4), inset 0 0 6px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge::after {
      content: '';
      width: 3px;
      height: 14px;
      background: #f0c060;
      border-radius: 2px;
      transform-origin: bottom center;
      position: absolute;
      bottom: 50%;
      left: calc(50% - 1.5px);
      animation: needle ease-in-out infinite alternate;
    }

    .gauge:nth-child(1)::after { animation-duration: 3.2s; transform: rotate(-30deg); }
    .gauge:nth-child(2)::after { animation-duration: 2.1s; transform: rotate(10deg); }
    .gauge:nth-child(3)::after { animation-duration: 4.0s; transform: rotate(-50deg); }

    @keyframes needle {
      from { transform: rotate(-60deg); }
      to   { transform: rotate(60deg); }
    }
  </style>
</head>
<body>

  <!-- Background gears -->
  <div class="gears">
    <div class="gear gear-1"></div>
    <div class="gear gear-2"></div>
    <div class="gear gear-3"></div>
    <div class="gear gear-4"></div>
  </div>

  <!-- Rising steam -->
  <div class="steam-wrap">
    <div class="steam"></div>
    <div class="steam"></div>
    <div class="steam"></div>
    <div class="steam"></div>
    <div class="steam"></div>
  </div>

  <!-- Main content -->
  <div class="frame rivets-bottom">
    <div class="divider">
      <div class="divider-line"></div>
      <span>&#9881;</span>
      <div class="divider-line"></div>
    </div>

    <h1>The Game</h1>

    <div class="divider">
      <div class="divider-line"></div>
      <span>&#9881;</span>
      <div class="divider-line"></div>
    </div>

    <p class="coming-soon">Coming Soon</p>

    <div class="gauge-row">
      <div class="gauge"></div>
      <div class="gauge"></div>
      <div class="gauge"></div>
    </div>
  </div>

</body>
</html>
